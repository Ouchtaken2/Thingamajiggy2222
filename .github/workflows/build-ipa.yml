name: Build Frickbears3 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download game web build
        run: bash Scripts/fetch-web-build.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Frickbears3iOS.xcodeproj \
            -scheme Frickbears3iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Frickbears3iOS.app Payload/

          # XcodeGen does not reliably bundle the Game/ folder, so copy it in
          # explicitly. GameURLSchemeHandler serves from App.app/Game/.
          mkdir -p Payload/Frickbears3iOS.app/Game
          cp -R Game/. Payload/Frickbears3iOS.app/Game/

          # Fail loudly if the assets did not make it in, instead of shipping
          # a useless 96 KB IPA.
          test -f Payload/Frickbears3iOS.app/Game/index.html
          test -f Payload/Frickbears3iOS.app/Game/runner.wasm
          test -f Payload/Frickbears3iOS.app/Game/runner.data

          du -sh Payload/Frickbears3iOS.app/Game
          zip -qry Frickbears3iOS.ipa Payload
          ls -lh Frickbears3iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Frickbears3iOS-IPA
          path: Frickbears3iOS.ipa
          if-no-files-found: error
